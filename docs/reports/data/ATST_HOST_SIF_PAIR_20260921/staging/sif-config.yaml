calculation:
  type: relax
  init_structure: /work/atst/examples/06_relax_H2-Au/inputs/init.stru
  fmax: 0.05
  max_steps: 1
  optimizer: QuasiNewton
  trajectory: relax.traj

runtime:
  devices: [0]
  binding: inherit
  telemetry: true

calculator:
  name: abacus
  abacus:
    command: /usr/local/bin/abacus
    mpi: 1
    omp: 8
    directory: relax_run_sif
    kpts: [3, 1, 3]
    parameters:
        calculation: scf
        ecutwfc: 100
        basis_type: lcao
        ks_solver: cusolver
        vdw_method: d3_bj
        nspin: 2
        symmetry: 1
        scf_thr: 1e-07
        scf_nmax: 300
        smearing_method: mp
        smearing_sigma: 0.002
        mixing_type: broyden
        mixing_ndim: 20
        cal_force: 1
        cal_stress: 0
        out_stru: 1
        out_chg: -1
        efield_flag: 1
        dip_cor_flag: 1
        efield_dir: 1
        pseudo_dir: /work/atst/examples/data
        orbital_dir: /work/atst/examples/data
        pseudopotentials:
           H: H_ONCV_PBE-1.0.upf
           Au: Au_ONCV_PBE-1.0.upf
        basissets:
           H: H_gga_6au_100Ry_2s1p.orb
           Au: Au_gga_7au_100Ry_4s2p2d1f.orb
