name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or ref to publish, for example v2.0.1
        required: true
        default: v2.0.1

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve-release.outputs.ref }}

    steps:
      - name: Resolve release ref
        id: resolve-release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    needs: resolve-release

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check release readiness
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.ref }}
        run: |
          python scripts/check_release_readiness.py --tag "$RELEASE_TAG"

      - name: Run unit tests
        run: |
          python -m pytest tests -q

      - name: Check documentation governance
        run: |
          python scripts/check_docs_governance.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Verify wheel public API
        run: python scripts/verify_wheel_api.py --wheel dist/*.whl

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release-preflight
    environment:
      name: pypi
      url: https://pypi.org/project/atst-tools/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
